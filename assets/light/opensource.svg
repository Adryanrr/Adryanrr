<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" fill="none" role="img" aria-label="6 projetos de código aberto">
<style>.m{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,&quot;JetBrains Mono&quot;,Menlo,Consolas,monospace}.s{font-family:&quot;Space Grotesk&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.ink{fill:#16150F}.ink2{fill:#4B4A42}.mut{fill:#807E73}.acc{fill:#16150F}.ok{fill:#16150F}
.rule{stroke:#CFCBBF;stroke-width:1}
.fade{opacity:0;animation:fade .7s ease forwards}@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.fade,.draw,.blink,.pulse{animation:none;opacity:1;stroke-dashoffset:0}}</style>
<g class="fade" style="animation-delay:0.05s" transform="translate(0 10)"><text x="48" y="24" class="m ink" font-size="17" font-weight="700" letter-spacing=".8">01 / SIMULADORCOLETALIXO</text><text x="952" y="20" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">JAVA · SIMULAÇÃO</text><text x="48" y="54" class="m ink2" font-size="12.5" >Simulador orientado a eventos da coleta de lixo urbano em Teresina, com horários de pico e capacidade.</text><text x="48" y="73" class="m ink2" font-size="12.5" >Listas próprias e descarregamento em estações de transferência até o aterro sanitário.</text><text x="48" y="96" class="m mut" font-size="10.5" letter-spacing="1.2">JAVA · EVENTOS DISCRETOS · ESTRUTURAS DE DADOS</text><line class="rule" x1="48" y1="112" x2="952" y2="112"/></g>
<g class="fade" style="animation-delay:0.13s" transform="translate(0 134)"><text x="48" y="24" class="m ink" font-size="17" font-weight="700" letter-spacing=".8">02 / TEST-ORCHESTRATOR</text><text x="952" y="20" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">PYTHON · QA</text><text x="48" y="54" class="m ink2" font-size="12.5" >Suíte de testes end-to-end cobrindo APIs e fluxos web, com integração contínua.</text><text x="48" y="73" class="m ink2" font-size="12.5" >Selenium, boas práticas de engenharia e pipeline de CI/CD.</text><text x="48" y="96" class="m mut" font-size="10.5" letter-spacing="1.2">PYTHON · SELENIUM · CI/CD</text><line class="rule" x1="48" y1="112" x2="952" y2="112"/></g>
<g class="fade" style="animation-delay:0.21000000000000002s" transform="translate(0 258)"><text x="48" y="24" class="m ink" font-size="17" font-weight="700" letter-spacing=".8">03 / SISTEMA-GESTAO-CONSULTORIA</text><text x="952" y="20" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">TYPESCRIPT · GESTÃO</text><text x="48" y="54" class="m ink2" font-size="12.5" >GHAST: gestão para consultorias de planejamento financeiro, gestão empresarial e análise de dados.</text><text x="48" y="73" class="m ink2" font-size="12.5" >Automatiza o cadastro de clientes e consultores e o controle de contratos.</text><text x="48" y="96" class="m mut" font-size="10.5" letter-spacing="1.2">TYPESCRIPT · SISTEMA DE GESTÃO</text><line class="rule" x1="48" y1="112" x2="952" y2="112"/></g>
<g class="fade" style="animation-delay:0.29s" transform="translate(0 382)"><text x="48" y="24" class="m ink" font-size="17" font-weight="700" letter-spacing=".8">04 / ANALISE-PORTAL-TRANSPARENCIA</text><text x="952" y="20" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">PYTHON · DADOS ABERTOS</text><text x="48" y="54" class="m ink2" font-size="12.5" >Análise dos gastos públicos com viagens em 2023, extraídos do Portal da Transparência.</text><text x="48" y="73" class="m ink2" font-size="12.5" >Gera relatórios consolidados e gráficos para facilitar a leitura e promover a transparência.</text><text x="48" y="96" class="m mut" font-size="10.5" letter-spacing="1.2">PYTHON · DADOS PÚBLICOS · VISUALIZAÇÃO</text><line class="rule" x1="48" y1="112" x2="952" y2="112"/></g>
<g class="fade" style="animation-delay:0.37s" transform="translate(0 506)"><text x="48" y="24" class="m ink" font-size="17" font-weight="700" letter-spacing=".8">05 / TODO-LIST</text><text x="952" y="20" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">API REST</text><text x="48" y="54" class="m ink2" font-size="12.5" >API RESTful de tarefas com CRUD completo, totalmente containerizada com Docker.</text><text x="48" y="73" class="m ink2" font-size="12.5" >Fastify, Prisma ORM e PostgreSQL, com Prisma Studio para inspecionar o banco.</text><text x="48" y="96" class="m mut" font-size="10.5" letter-spacing="1.2">FASTIFY · PRISMA · POSTGRESQL · DOCKER</text><line class="rule" x1="48" y1="112" x2="952" y2="112"/></g>
<g class="fade" style="animation-delay:0.45s" transform="translate(0 630)"><text x="48" y="24" class="m ink" font-size="17" font-weight="700" letter-spacing=".8">06 / BOOK-ANALYTICS</text><text x="952" y="20" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">PYTHON · DASHBOARD</text><text x="48" y="54" class="m ink2" font-size="12.5" >Dashboard interativo de livros: filtro por preço e gráficos de preços e anos de publicação.</text><text x="48" y="73" class="m ink2" font-size="12.5" >Inclui uma página com detalhes e avaliações de cada livro.</text><text x="48" y="96" class="m mut" font-size="10.5" letter-spacing="1.2">PYTHON · STREAMLIT</text><line class="rule" x1="48" y1="112" x2="952" y2="112"/></g>
</svg>
