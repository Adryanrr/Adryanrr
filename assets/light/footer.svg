<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" fill="none" role="img" aria-label="Status atual">
<style>.m{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,&quot;JetBrains Mono&quot;,Menlo,Consolas,monospace}.s{font-family:&quot;Space Grotesk&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.ink{fill:#16150F}.ink2{fill:#4B4A42}.mut{fill:#807E73}.acc{fill:#16150F}.ok{fill:#16150F}
.rule{stroke:#CFCBBF;stroke-width:1}
.fade{opacity:0;animation:fade .7s ease forwards}@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.fade,.draw,.blink,.pulse{animation:none;opacity:1;stroke-dashoffset:0}}</style>
<line class="rule draw" x1="48" y1="18" x2="952" y2="18" style="animation-delay:0s"/>
<g class="fade" style="animation-delay:0s"><text x="48" y="50" class="m acc" font-size="14" >$</text><text x="66" y="50" class="m ink" font-size="14" >status</text></g>
<g class="fade" style="animation-delay:0.2s"><text x="48" y="84" class="m mut" font-size="13" >▸ construindo</text><text x="220" y="84" class="m ink" font-size="13" >Mural de Preços · MedSpace · GEC Core</text></g>
<g class="fade" style="animation-delay:0.30000000000000004s"><text x="48" y="110" class="m mut" font-size="13" >▸ aprofundando</text><text x="220" y="110" class="m ink" font-size="13" >arquitetura de software · cloud (AWS) · engenharia de dados · Linux</text></g>
<g class="fade" style="animation-delay:0.4s"><text x="48" y="136" class="m mut" font-size="13" >▸ disponível</text><text x="220" y="136" class="m ink" font-size="13" >projetos sob demanda · freelance · colaboração open source</text></g>
<g class="fade" style="animation-delay:0.6s"><text x="938" y="50" class="m mut" font-size="10.5" letter-spacing="2" text-anchor="end">ATUALIZADO · NOV 2026</text><rect x="944" y="40" width="8" height="12" class="acc blink"/></g>
</svg>
